{% extends "layout.html" %}
{% block content %}
<h2>Students</h2>

<form method="GET" action="{{ url_for('students') }}" class="search-box">
    <input type="text" name="q" value="{{ query }}" placeholder="Search by name, roll, department">
    <button type="submit">Search</button>
</form>

<table>
    <tr>
        
        <th>Name</th>
        <th>Roll</th>
        <th>Department</th>
        <th>Face Samples</th>
        <th>Actions</th>
    </tr>
    {% for s in students %}
    <tr>
        
        <td>{{ s.name }}</td>
        <td>{{ s.roll }}</td>
        <td>{{ s.department }}</td>
        <td>{{ s.face_count }}</td>
        <td class="action-cell">
            <a class="btn-small" href="{{ url_for('capture_face', student_id=s.id) }}">Capture</a>
            <a class="btn-small warning" href="{{ url_for('reset_face', student_id=s.id) }}">Reset Face</a>
            <a class="btn-small edit" href="{{ url_for('edit_student', student_id=s.id) }}">Edit</a>
            <a class="btn-small success" href="{{ url_for('manual_attendance', student_id=s.id) }}">Manual Mark</a>
            <a class="btn-small delete" href="{{ url_for('delete_student', student_id=s.id) }}" onclick="return confirm('Delete this student?')">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
